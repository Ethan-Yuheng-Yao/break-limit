<!doctype html><html><head><meta charset="utf-8"><title>Nyra form review</title><style>body{background:#101925;color:#ffe4b7;font:14px Arial;margin:0}main{display:grid;grid-template-columns:1fr 1fr;gap:10px}section{background:#172331}h2{margin:15px}canvas{width:100%;display:block}</style></head><body><main></main><script type="module">
import {Game,skillNames} from '../src/engine.js';import {Renderer,drawFighter} from '../src/render.js';
const params=new URLSearchParams(location.search),slot=Number(params.get('slot')??-1),seconds=Number(params.get('time')??1.2);
for(let tier=1;tier<=4;tier++){const section=document.createElement('section'),title=document.createElement('h2'),canvas=document.createElement('canvas');canvas.width=1440;canvas.height=810;section.append(title,canvas);document.querySelector('main').append(section);const renderer=new Renderer(canvas);renderer.reduced=true;const game=new Game({character:'nyra',mode:'local',onEvent:e=>renderer.event(e)});game.phase='fight';game.fighters.forEach((f,i)=>Object.assign(f,{tier,x:500+i*250,hp:10000,maxHp:10000,meter:100}));title.textContent='FORM '+tier+(slot>=0?' · '+skillNames(game.fighters[0])[slot]:'');if(slot>=0){game.action(0,slot);for(let i=0;i<seconds*120;i++){game.freeze=0;game.update(1/120);renderer.render(game,1/120);}}else{renderer.background(0,false);const c=renderer.c;c.save();c.translate(720,740);c.scale(3.4,3.4);drawFighter(c,{...game.fighters[0],x:0,y:0},1,{portrait:true});c.restore();}if(slot>=0){renderer.flash=0;renderer.render(game,0);}}
</script></body></html>
