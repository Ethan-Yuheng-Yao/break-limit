<!doctype html><html><head><meta charset="utf-8"><title>Character animation review</title><style>body{margin:0;background:#101a27;color:#d9f2ee;font:14px Arial}h1,p{margin:20px}canvas{width:100%;display:block}button{margin:5px 20px;padding:10px;background:#b5f5ea;border:0;cursor:pointer}</style></head><body><h1>Character motion · wind-up / strike / follow-through</h1><p>Deterministic pose samples using the actual game character renderer. Effects are omitted to inspect body motion.</p><button id="toggle">Play animations</button><canvas width="1440" height="1900"></canvas><script type="module">
import {drawFighter} from '../src/render.js';import {fighter} from '../src/engine.js';
const c=document.querySelector('canvas').getContext('2d'),rows=['kairo-godflash','kairo-shield','kairo-ascend','kairo-execution','kairo-judgement','vex-horizon','vex-shield','vex-zero','vex-collapse','vex-apocalypse'];let live=false;
document.querySelector('button').onclick=()=>{live=!live;document.querySelector('button').textContent=live?'Show key poses':'Play animations';};
function draw(ms){c.fillStyle='#101a27';c.fillRect(0,0,1440,1900);for(let row=0;row<rows.length;row++){const name=rows[row];c.fillStyle='#b5f5ea';c.font='15px Arial';c.fillText(name,20,row*190+24);for(let i=0;i<5;i++){const p=live?((ms/1800+i*.1)%1):[0,.23,.46,.7,.9][i],f=fighter(0,name.startsWith('kairo')?'kairo':'vex');f.x=280+i*260;f.y=row*190+178;f.pose='skill';f.attackTime=1;f.animation={name,elapsed:p,duration:1};drawFighter(c,f,0);}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
